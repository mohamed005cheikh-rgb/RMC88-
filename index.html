<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0f">
    <title>rmc88 - Remote Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="header glass">
            <div class="logo-container">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>rmc88</h1>
                    <span class="version">v2.0</span>
                </div>
            </div>
            
            <div class="connection-status" id="connectionStatus">
                <span class="status-dot"></span>
                <span class="status-text">Disconnected</span>
            </div>
            
            <button class="settings-btn" id="settingsBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
            </button>
        </header>

        <!-- Settings Modal -->
        <div class="modal glass" id="settingsModal">
            <div class="modal-content">
                <h2>Connection Settings</h2>
                <div class="input-group">
                    <label for="serverIp">Server IP Address</label>
                    <input type="text" id="serverIp" placeholder="192.168.1.100" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="serverPort">Port</label>
                    <input type="number" id="serverPort" value="5555">
                </div>
                <div class="input-group">
                    <label for="sensitivity">Mouse Sensitivity</label>
                    <input type="range" id="sensitivity" min="0.5" max="3" step="0.1" value="1.5">
                    <span id="sensitivityValue">1.5x</span>
                </div>
                <button class="btn-primary" id="connectBtn">Connect</button>
                <button class="btn-secondary" id="testConnectionBtn">Test Connection</button>
                <button class="btn-secondary" id="closeSettings">Close</button>
            </div>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Touchpad Section -->
            <div class="touchpad-section">
                <div class="touchpad glass" id="touchpad">
                    <div class="touchpad-hint">Touch to move cursor</div>
                    
                    <!-- Touchpad buttons overlay -->
                    <div class="touchpad-buttons">
                        <button class="touch-btn left-btn" id="leftClickBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="5" y="7" width="14" height="10" rx="2"/>
                            </svg>
                        </button>
                        <button class="touch-btn right-btn" id="rightClickBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="5" y="7" width="14" height="10" rx="2"/>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <!-- Quick Actions -->
                <div class="quick-actions">
                    <button class="action-btn glass" id="scrollUpBtn" title="Scroll Up">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 19V5M5 12l7-7 7 7"/>
                        </svg>
                    </button>
                    <button class="action-btn glass" id="scrollDownBtn" title="Scroll Down">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M19 12l-7 7-7-7"/>
                        </svg>
                    </button>
                    <button class="action-btn glass" id="keyboardToggleBtn" title="Toggle Keyboard">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="6" width="20" height="12" rx="2"/>
                            <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M8 14h8"/>
                        </svg>
                    </button>
                    <button class="action-btn glass emergency-btn" id="releaseAllBtn" title="Release All Keys">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6L6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                
                <!-- Shortcut Buttons -->
                <div class="shortcuts-row">
                    <button class="shortcut-btn glass" data-hotkey="ctrl+c">
                        <span class="shortcut-icon">📋</span>
                        <span class="shortcut-text">Copy</span>
                    </button>
                    <button class="shortcut-btn glass" data-hotkey="ctrl+v">
                        <span class="shortcut-icon">📄</span>
                        <span class="shortcut-text">Paste</span>
                    </button>
                    <button class="shortcut-btn glass" data-hotkey="ctrl+x">
                        <span class="shortcut-icon">✂️</span>
                        <span class="shortcut-text">Cut</span>
                    </button>
                    <button class="shortcut-btn glass" data-hotkey="alt+tab">
                        <span class="shortcut-icon">🔄</span>
                        <span class="shortcut-text">Switch</span>
                    </button>
                    <button class="shortcut-btn glass" data-hotkey="ctrl+z">
                        <span class="shortcut-icon">↩️</span>
                        <span class="shortcut-text">Undo</span>
                    </button>
                    <button class="shortcut-btn glass" data-hotkey="ctrl+a">
                        <span class="shortcut-icon">✅</span>
                        <span class="shortcut-text">Select All</span>
                    </button>
                </div>
            </div>

            <!-- Keyboard Section -->
            <div class="keyboard-section glass" id="keyboardSection">
                <!-- Function Keys Row -->
                <div class="keyboard-row">
                    <button class="key function-key" data-key="escape">ESC</button>
                    <button class="key function-key" data-key="f1">F1</button>
                    <button class="key function-key" data-key="f2">F2</button>
                    <button class="key function-key" data-key="f3">F3</button>
                    <button class="key function-key" data-key="f4">F4</button>
                    <button class="key function-key" data-key="f5">F5</button>
                    <button class="key function-key" data-key="f6">F6</button>
                    <button class="key function-key" data-key="f7">F7</button>
                    <button class="key function-key" data-key="f8">F8</button>
                    <button class="key function-key" data-key="f9">F9</button>
                    <button class="key function-key" data-key="f10">F10</button>
                    <button class="key function-key" data-key="f11">F11</button>
                    <button class="key function-key" data-key="f12">F12</button>
                </div>
                
                <!-- Number Row -->
                <div class="keyboard-row">
                    <button class="key wide-key" data-key="`">`</button>
                    <button class="key" data-key="1">1</button>
                    <button class="key" data-key="2">2</button>
                    <button class="key" data-key="3">3</button>
                    <button class="key" data-key="4">4</button>
                    <button class="key" data-key="5">5</button>
                    <button class="key" data-key="6">6</button>
                    <button class="key" data-key="7">7</button>
                    <button class="key" data-key="8">8</button>
                    <button class="key" data-key="9">9</button>
                    <button class="key" data-key="0">0</button>
                    <button class="key" data-key="-">-</button>
                    <button class="key" data-key="=">=</button>
                    <button class="key wide-key" data-key="backspace">⌫</button>
                </div>
                
                <!-- QWERTY Row 1 -->
                <div class="keyboard-row">
                    <button class="key extra-wide-key" data-key="tab">TAB</button>
                    <button class="key" data-key="q">Q</button>
                    <button class="key" data-key="w">W</button>
                    <button class="key" data-key="e">E</button>
                    <button class="key" data-key="r">R</button>
                    <button class="key" data-key="t">T</button>
                    <button class="key" data-key="y">Y</button>
                    <button class="key" data-key="u">U</button>
                    <button class="key" data-key="i">I</button>
                    <button class="key" data-key="o">O</button>
                    <button class="key" data-key="p">P</button>
                    <button class="key" data-key="[">[</button>
                    <button class="key" data-key="]">]</button>
                    <button class="key extra-wide-key" data-key="\">\</button>
                </div>
                
                <!-- QWERTY Row 2 -->
                <div class="keyboard-row">
                    <button class="key extra-wide-key" data-key="capslock">CAPS</button>
                    <button class="key" data-key="a">A</button>
                    <button class="key" data-key="s">S</button>
                    <button class="key" data-key="d">D</button>
                    <button class="key" data-key="f">F</button>
                    <button class="key" data-key="g">G</button>
                    <button class="key" data-key="h">H</button>
                    <button class="key" data-key="j">J</button>
                    <button class="key" data-key="k">K</button>
                    <button class="key" data-key="l">L</button>
                    <button class="key" data-key=";">;</button>
                    <button class="key" data-key="'">'</button>
                    <button class="key extra-wide-key" data-key="enter">ENTER</button>
                </div>
                
                <!-- QWERTY Row 3 -->
                <div class="keyboard-row">
                    <button class="key ultra-wide-key" data-key="shift">SHIFT</button>
                    <button class="key" data-key="z">Z</button>
                    <button class="key" data-key="x">X</button>
                    <button class="key" data-key="c">C</button>
                    <button class="key" data-key="v">V</button>
                    <button class="key" data-key="b">B</button>
                    <button class="key" data-key="n">N</button>
                    <button class="key" data-key="m">M</button>
                    <button class="key" data-key=",">,</button>
                    <button class="key" data-key=".">.</button>
                    <button class="key" data-key="/">/</button>
                    <button class="key ultra-wide-key" data-key="shift">SHIFT</button>
                </div>
                
                <!-- Bottom Row -->
                <div class="keyboard-row">
                    <button class="key space-key" data-key="ctrl">CTRL</button>
                    <button class="key space-key" data-key="win">WIN</button>
                    <button class="key space-key" data-key="alt">ALT</button>
                    <button class="key space-bar" data-key="space">SPACE</button>
                    <button class="key space-key" data-key="alt">ALT</button>
                    <button class="key space-key" data-key="ctrl">CTRL</button>
                    <button class="key space-key" data-key="left">←</button>
                    <button class="key space-key" data-key="up">↑</button>
                    <button class="key space-key" data-key="down">↓</button>
                    <button class="key space-key" data-key="right">→</button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer glass">
            <p>Copyright © 2026 mohamed005cheikh@gmail.com | by mc88</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
