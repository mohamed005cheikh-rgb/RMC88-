<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>rmc88 - Remote</title>
    <style>
        :root {
            --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; 
            --accent: #3b82f6; --muted: #64748b; --border: #334155;
            --btn: #334155; --touchpad: #020617;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overscroll-behavior: none; }
        
        /* Header */
        header { background: var(--panel); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .logo-area { display: flex; flex-direction: column; }
        h1 { font-size: 1.2rem; font-weight: bold; letter-spacing: 1px; }
        .status { font-size: 0.75rem; color: #ef4444; display: flex; align-items: center; gap: 5px; margin-top: 3px; }
        .status.connected { color: #10b981; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
        .status.connected .dot { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }
        
        .header-btns { display: flex; gap: 10px; }
        .icon-btn { background: var(--btn); border: none; color: white; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .icon-btn:active { transform: scale(0.95); opacity: 0.8; }
        .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .icon-btn.active { background: var(--accent); }

        /* Main Layout */
        main { flex: 1; display: flex; flex-direction: column; padding: 15px; gap: 15px; position: relative; }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        /* Settings Modal */
        #settings-panel { display: none; }
        #settings-panel.show { display: flex; }
        .input-group { display: flex; gap: 10px; }
        .input-box { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; font-weight: bold; }
        input { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 12px; border-radius: 10px; font-size: 0.9rem; width: 100%; outline: none; }
        input:focus { border-color: var(--accent); }
        .btn-connect { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; margin-top: auto; cursor: pointer; transition: 0.2s;}
        .btn-connect:active { transform: scale(0.97); }

        /* Touchpad */
        .touch-container { flex: 1; display: flex; flex-direction: column; min-height: 250px; }
        .touchpad { flex: 1; background: var(--touchpad); border: 1px solid var(--border); border-radius: 12px; display: flex; justify-content: center; align-items: center; touch-action: none; position: relative; }
        .touchpad span { color: rgba(255,255,255,0.1); font-weight: bold; pointer-events: none; user-select: none;}
        .mouse-btns { display: flex; gap: 10px; margin-top: 10px; }
        .mouse-btn { flex: 1; background: var(--btn); color: var(--text); border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .mouse-btn:active { background: #475569; }

        /* Keyboard Panel */
        #keyboard-panel { display: none; transition: 0.3s; }
        #keyboard-panel.show { display: flex; }
        .keys-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .keys-grid-3 { grid-template-columns: repeat(3, 1fr); }
        .key-btn { background: var(--btn); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; }
        .key-btn:active { background: #475569; transform: scale(0.95); }
        .key-btn.blue { color: #60a5fa; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>rmc88</h1>
            <div class="status" id="conn-status"><div class="dot"></div> <span id="status-text">Disconnected</span></div>
        </div>
        <div class="header-btns">
            <button class="icon-btn" id="btn-keyboard" onclick="togglePanel('keyboard-panel', 'btn-keyboard')">
                <svg viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg>
            </button>
            <button class="icon-btn" id="btn-settings" onclick="togglePanel('settings-panel', 'btn-settings')">
                <svg viewBox="0 0 24 24"><path d="M12 21c-4.97 0-9-4.03-9-9s4.03-9 9-9 9 4.03 9 9-4.03 9-9 9zm0-16c-3.86 0-7 3.14-7 7s3.14 7 7 7 7-3.14 7-7-3.14-7-7-7zm2 10.5l-3-3v-4h2v3.2l2.4 2.4-1.4 1.4z"/></svg>
            </button>
        </div>
    </header>

    <main>
        <!-- Settings Panel -->
        <div class="panel" id="settings-panel">
            <div class="input-group">
                <div class="input-box">
                    <label>Server IP</label>
                    <input type="text" id="ip-input" placeholder="192.168.X.X">
                </div>
                <div class="input-box" style="flex: 0.4;">
                    <label>Port</label>
                    <input type="text" id="port-input" value="5555">
                </div>
                <button class="btn-connect" onclick="connect()">Connect</button>
            </div>
        </div>

        <!-- Keyboard Panel -->
        <div class="panel" id="keyboard-panel">
            <input type="text" id="kb-input" placeholder="Tap to type..." oninput="handleType(event)" onkeydown="checkEnter(event)">
            <div class="keys-grid">
                <button class="key-btn" onclick="sendKey('enter')">Enter</button>
                <button class="key-btn" onclick="sendKey('backspace')">Bksp</button>
                <button class="key-btn" onclick="sendKey('space')">Space</button>
                <button class="key-btn" onclick="sendKey('escape')">Esc</button>
            </div>
            <div class="keys-grid keys-grid-3">
                <button class="key-btn blue" onclick="sendHot(['ctrl','c'])">Ctrl+C</button>
                <button class="key-btn blue" onclick="sendHot(['ctrl','v'])">Ctrl+V</button>
                <button class="key-btn blue" onclick="sendHot(['alt','tab'])">Alt+Tab</button>
            </div>
        </div>

        <!-- Touchpad Panel -->
        <div class="panel touch-container">
            <div class="touchpad" id="touchpad">
                <span>Touch & Drag</span>
            </div>
            <div class="mouse-btns">
                <button class="mouse-btn" onclick="mouseClick('left')">Left Click</button>
                <button class="mouse-btn" onclick="mouseClick('right')">Right Click</button>
            </div>
        </div>
    </main>

    <script>
        let serverUrl = localStorage.getItem('rmc_url') || '';
        let savedIp = localStorage.getItem('rmc_ip') || '';
        let savedPort = localStorage.getItem('rmc_port') || '5555';

        window.onload = () => {
            document.getElementById('ip-input').value = savedIp;
            document.getElementById('port-input').value = savedPort;
            if(!serverUrl) {
                document.getElementById('settings-panel').classList.add('show');
                document.getElementById('btn-settings').classList.add('active');
            } else {
                checkPing();
            }
        };

        function togglePanel(panelId, btnId) {
            document.getElementById(panelId).classList.toggle('show');
            document.getElementById(btnId).classList.toggle('active');
        }

        function connect() {
            let ip = document.getElementById('ip-input').value.trim();
            let port = document.getElementById('port-input').value.trim();
            if(!ip) return alert("Enter IP Address!");
            
            serverUrl = `http://${ip}:${port}`;
            localStorage.setItem('rmc_url', serverUrl);
            localStorage.setItem('rmc_ip', ip);
            localStorage.setItem('rmc_port', port);
            
            togglePanel('settings-panel', 'btn-settings');
            checkPing();
        }

        async function checkPing() {
            if(!serverUrl) return;
            const statusBox = document.getElementById('conn-status');
            const statusTxt = document.getElementById('status-text');
            try {
                let res = await fetch(`${serverUrl}/ping`);
                if(res.ok) {
                    statusBox.classList.add('connected');
                    statusTxt.innerText = 'Connected';
                }
            } catch(e) {
                statusBox.classList.remove('connected');
                statusTxt.innerText = 'Disconnected';
            }
        }

        async function sendCommand(action, data = {}) {
            if(!serverUrl) return;
            fetch(`${serverUrl}/command`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, ...data })
            }).catch(()=>{}); // Ignore errors to prevent UI freezing
        }

        // --- Touchpad Logic with Anti-Lag (Throttling) ---
        const pad = document.getElementById('touchpad');
        let isTouching = false;
        let lastX = 0, lastY = 0;
        let dxAcc = 0, dyAcc = 0;
        let lastSendTime = 0;

        pad.addEventListener('touchstart', e => {
            e.preventDefault();
            isTouching = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        }, {passive: false});

        pad.addEventListener('touchmove', e => {
            e.preventDefault();
            if(!isTouching) return;
            
            let curX = e.touches[0].clientX;
            let curY = e.touches[0].clientY;
            
            dxAcc += (curX - lastX) * 1.8; // Sensitivity
            dyAcc += (curY - lastY) * 1.8;
            
            lastX = curX; lastY = curY;

            // Throttling: Send max ~30 times per second to fix lag
            let now = Date.now();
            if(now - lastSendTime > 30) {
                sendCommand('mouse_move', { dx: dxAcc, dy: dyAcc });
                dxAcc = 0; dyAcc = 0;
                lastSendTime = now;
            }
        }, {passive: false});

        pad.addEventListener('touchend', e => { e.preventDefault(); isTouching = false; });
        function mouseClick(btn) { sendCommand('mouse_click', { button: btn }); }

        // --- Keyboard Logic ---
        let lastLen = 0;
        function handleType(e) {
            let val = e.target.value;
            if(val.length > lastLen) sendCommand('type_text', { text: val.slice(lastLen) });
            else if(val.length < lastLen) sendCommand('key_press', { key: 'backspace' });
            lastLen = val.length;
            if(val.length > 10) { e.target.value = ''; lastLen = 0; }
        }
        function checkEnter(e) {
            if(e.key === 'Enter') { sendCommand('key_press', {key:'enter'}); e.target.value=''; lastLen=0; e.preventDefault();}
        }
        function sendKey(k) { sendCommand('key_press', { key: k }); }
        function sendHot(keys) { sendCommand('hotkey', { keys: keys }); }
    </script>
</body>
</html>
