<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RMC88 - Burgundy Pro</title>
    <style>
        :root {
            /* Aesthetic Burgundy Palette */
            --bg: #1a0f14;
            --panel: #2b1620;
            --panel-card: #3a1f2c;
            --text: #f3e8ee;
            --muted: #b897a6;
            --accent: #8b2649;
            --accent-hover: #a82e58;
            --accent-glow: rgba(139, 38, 73, 0.4);
            --border: #4a2837;
            --touchpad-bg: #12090d;
            --success: #2ecc71;
            --danger: #e74c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; overscroll-behavior: none; }

        /* Header */
        header { background: var(--panel); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 10; }
        .logo-area h1 { font-size: 1.1rem; font-weight: 800; letter-spacing: 2px; color: #fff; }
        .status { font-size: 0.65rem; color: var(--danger); display: flex; align-items: center; gap: 6px; margin-top: 2px; font-weight: 700; text-transform: uppercase; }
        .status.connected { color: var(--success); }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); transition: 0.3s; }
        .status.connected .dot { background: var(--success); box-shadow: 0 0 10px var(--success); }

        .header-btns { display: flex; gap: 8px; }
        .icon-btn { background: var(--panel-card); border: 1px solid var(--border); color: var(--text); width: 38px; height: 38px; border-radius: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
        .icon-btn.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

        /* Main Container */
        main { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 10px; overflow: hidden; max-width: 500px; width: 100%; margin: 0 auto; justify-content: space-between; }

        /* Cards & Panels */
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        
        .panel-hidden { display: none !important; }
        .panel-show { display: flex !important; animation: fadeIn 0.2s ease; }

        /* Settings Row */
        .input-row { display: flex; gap: 8px; align-items: flex-end; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        input { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 10px; border-radius: 8px; font-size: 0.85rem; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
        
        .btn-action { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; height: 41px; transition: 0.2s; }
        .btn-action:active { background: var(--accent-hover); transform: scale(0.96); }

        /* Keyboard Panel */
        .keys-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .keys-grid-3 { grid-template-columns: repeat(3, 1fr); }
        .key-btn { background: var(--panel-card); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: 0.1s; }
        .key-btn:active { background: var(--accent); color: white; transform: scale(0.95); }
        .key-btn.burgundy { color: #f48fb1; border-color: rgba(244, 143, 177, 0.3); }

        /* Touchpad Area */
        .touchpad-card { flex: 1; display: flex; flex-direction: column; min-height: 220px; }
        .touchpad { flex: 1; background: var(--touchpad-bg); border: 2px dashed var(--border); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; touch-action: none; position: relative; overflow: hidden; user-select: none; }
        .touchpad span { color: var(--muted); font-weight: 700; font-size: 0.85rem; letter-spacing: 1px; pointer-events: none; }
        .touchpad sub { color: var(--muted); font-size: 0.6rem; margin-top: 4px; opacity: 0.6; pointer-events: none; }

        /* Fixed Mouse Click Buttons */
        .mouse-actions { display: flex; gap: 10px; margin-top: 4px; }
        .mouse-btn { flex: 1; background: var(--panel-card); border: 1px solid var(--border); color: var(--text); padding: 14px; border-radius: 12px; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.15s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .mouse-btn:active { background: var(--accent); border-color: var(--accent); color: white; transform: scale(0.97); }
        .mouse-btn svg { width: 16px; height: 16px; fill: currentColor; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>RMC88</h1>
            <div class="status" id="conn-status"><div class="dot"></div> <span id="status-text">Disconnected</span></div>
        </div>
        <div class="header-btns">
            <button class="icon-btn" id="btn-keyboard" onclick="togglePanel('keyboard-panel')" title="Keyboard">
                <svg viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg>
            </button>
            <button class="icon-btn" id="btn-settings" onclick="togglePanel('settings-panel')" title="Settings">
                <svg viewBox="0 0 24 24"><path d="M12 21c-4.97 0-9-4.03-9-9s4.03-9 9-9 9 4.03 9 9-4.03 9-9 9zm0-16c-3.86 0-7 3.14-7 7s3.14 7 7 7 7-3.14 7-7-3.14-7-7-7zm2 10.5l-3-3v-4h2v3.2l2.4 2.4-1.4 1.4z"/></svg>
            </button>
        </div>
    </header>

    <main>
        <!-- Settings Panel -->
        <div class="card panel-hidden" id="settings-panel">
            <div class="input-row">
                <div class="input-group">
                    <label>Server IP</label>
                    <input type="text" id="ip-input" placeholder="192.168.X.X">
                </div>
                <div class="input-group" style="flex: 0.4;">
                    <label>Port</label>
                    <input type="text" id="port-input" value="5555">
                </div>
                <button class="btn-action" onclick="connect()">Connect</button>
            </div>
        </div>

        <!-- Keyboard Panel -->
        <div class="card panel-hidden" id="keyboard-panel">
            <input type="text" id="kb-input" placeholder="Tap to type..." oninput="handleType(event)" onkeydown="checkEnter(event)">
            <div class="keys-grid">
                <button class="key-btn" onclick="sendKey('enter')">Enter</button>
                <button class="key-btn" onclick="sendKey('backspace')">Bksp</button>
                <button class="key-btn" onclick="sendKey('space')">Space</button>
                <button class="key-btn" onclick="sendKey('escape')">Esc</button>
            </div>
            <div class="keys-grid keys-grid-3">
                <button class="key-btn burgundy" onclick="sendHot(['ctrl','c'])">Ctrl+C</button>
                <button class="key-btn burgundy" onclick="sendHot(['ctrl','v'])">Ctrl+V</button>
                <button class="key-btn burgundy" onclick="sendHot(['alt','tab'])">Alt+Tab</button>
            </div>
        </div>

        <!-- Touchpad & Mouse Action Buttons -->
        <div class="card touchpad-card">
            <div class="touchpad" id="touchpad">
                <span>TOUCHPAD AREA</span>
                <sub>Move & Tap</sub>
            </div>
            <div class="mouse-actions">
                <button class="mouse-btn" onclick="mouseClick('left')">
                    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 0 1-8-8V8h8v12z"/></svg>
                    Left Click
                </button>
                <button class="mouse-btn" onclick="mouseClick('right')">
                    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18V8h8a8 8 0 0 1-8 12z"/></svg>
                    Right Click
                </button>
            </div>
        </div>
    </main>

    <script>
        let serverUrl = localStorage.getItem('rmc_url') || '';
        let savedIp = localStorage.getItem('rmc_ip') || '';
        let savedPort = localStorage.getItem('rmc_port') || '5555';

        window.onload = () => {
            document.getElementById('ip-input').value = savedIp;
            document.getElementById('port-input').value = savedPort;
            if(!serverUrl) {
                document.getElementById('settings-panel').classList.add('panel-show');
                document.getElementById('btn-settings').classList.add('active');
            } else {
                checkPing();
            }
        };

        function togglePanel(panelId) {
            const panel = document.getElementById(panelId);
            const isShown = panel.classList.contains('panel-show');
            
            document.querySelectorAll('.card').forEach(c => {
                if(!c.classList.contains('touchpad-card')) {
                    c.classList.remove('panel-show');
                }
            });
            document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));

            if(!isShown) {
                panel.classList.add('panel-show');
                if(panelId === 'keyboard-panel') document.getElementById('btn-keyboard').classList.add('active');
                if(panelId === 'settings-panel') document.getElementById('btn-settings').classList.add('active');
            }
        }

        function connect() {
            let ip = document.getElementById('ip-input').value.trim();
            let port = document.getElementById('port-input').value.trim();
            if(!ip) return alert("Please enter Server IP!");
            
            serverUrl = `http://${ip}:${port}`;
            localStorage.setItem('rmc_url', serverUrl);
            localStorage.setItem('rmc_ip', ip);
            localStorage.setItem('rmc_port', port);
            
            togglePanel('settings-panel');
            checkPing();
        }

        async function checkPing() {
            if(!serverUrl) return;
            const statusBox = document.getElementById('conn-status');
            const statusTxt = document.getElementById('status-text');
            try {
                let res = await fetch(`${serverUrl}/ping`, {signal: AbortSignal.timeout(2000)});
                if(res.ok) {
                    statusBox.classList.add('connected');
                    statusTxt.innerText = 'Connected';
                }
            } catch(e) {
                statusBox.classList.remove('connected');
                statusTxt.innerText = 'Disconnected';
            }
        }

        async function sendCommand(action, data = {}) {
            if(!serverUrl) return;
            fetch(`${serverUrl}/command`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, ...data })
            }).catch(()=>{});
        }

        // Touchpad Logic
        const pad = document.getElementById('touchpad');
        let isTouching = false;
        let lastX = 0, lastY = 0;
        let dxAcc = 0, dyAcc = 0;
        let lastSendTime = 0;
        let touchStartTime = 0;
        let totalMoveDist = 0;

        pad.addEventListener('touchstart', e => {
            e.preventDefault();
            if(e.touches.length === 1) {
                isTouching = true;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                touchStartTime = Date.now();
                totalMoveDist = 0;
            }
        }, {passive: false});

        pad.addEventListener('touchmove', e => {
            e.preventDefault();
            if(!isTouching) return;
            
            let curX = e.touches[0].clientX;
            let curY = e.touches[0].clientY;
            
            let deltaX = (curX - lastX) * 1.5;
            let deltaY = (curY - lastY) * 1.5;
            
            dxAcc += deltaX;
            dyAcc += deltaY;
            totalMoveDist += Math.abs(deltaX) + Math.abs(deltaY);
            
            lastX = curX; 
            lastY = curY;

            let now = Date.now();
            if(now - lastSendTime > 20) {
                sendCommand('mouse_move', { dx: Math.round(dxAcc), dy: Math.round(dyAcc) });
                dxAcc = 0; 
                dyAcc = 0;
                lastSendTime = now;
            }
        }, {passive: false});

        pad.addEventListener('touchend', e => { 
            e.preventDefault(); 
            if(isTouching) {
                isTouching = false;
                if((Date.now() - touchStartTime) < 200 && totalMoveDist < 10) {
                    mouseClick('left');
                }
            }
        }, {passive: false});

        function mouseClick(btn) { 
            sendCommand('mouse_click', { button: btn }); 
            if(navigator.vibrate) navigator.vibrate(35);
        }

        // Keyboard Logic
        let lastLen = 0;
        function handleType(e) {
            let val = e.target.value;
            if(val.length > lastLen) {
                sendCommand('type_text', { text: val.slice(lastLen) });
            } else if(val.length < lastLen) {
                sendCommand('key_press', { key: 'backspace' });
            }
            lastLen = val.length;
            if(val.length > 15) { e.target.value = ''; lastLen = 0; }
        }
        function checkEnter(e) {
            if(e.key === 'Enter') { 
                sendCommand('key_press', {key:'enter'}); 
                e.target.value=''; 
                lastLen=0; 
                e.preventDefault();
            }
        }
        function sendKey(k) { sendCommand('key_press', { key: k }); if(navigator.vibrate) navigator.vibrate(25); }
        function sendHot(keys) { sendCommand('hotkey', { keys: keys }); if(navigator.vibrate) navigator.vibrate(35); }
    </script>
</body>
</html>
