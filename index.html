<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>rmc88 - Remote Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Theme Variables */
        :root[data-theme="dark"] {
            --bg-main: #0f172a;
            --bg-panel: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --btn-bg: #334155;
            --btn-hover: #475569;
            --touchpad-bg: #020617;
        }
        
        :root[data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-panel: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #2563eb;
            --btn-bg: #f8fafc;
            --btn-hover: #e2e8f0;
            --touchpad-bg: #f8fafc;
        }

        :root[data-theme="neon"] {
            --bg-main: #09090b;
            --bg-panel: #18181b;
            --border-color: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #8b5cf6;
            --btn-bg: #27272a;
            --btn-hover: #3f3f46;
            --touchpad-bg: #000000;
        }

        /* Custom Utility Classes for Dynamic Theming */
        body { background-color: var(--bg-main); color: var(--text-main); transition: background-color 0.3s, color 0.3s; overscroll-behavior-y: none; }
        .panel { background-color: var(--bg-panel); border-color: var(--border-color); border-width: 1px; }
        .border-custom { border-color: var(--border-color); }
        .text-muted { color: var(--text-muted); }
        
        .btn-accent { background-color: var(--accent); color: white; border: none; }
        .btn-accent:active { opacity: 0.8; transform: scale(0.97); }
        
        .btn-secondary { background-color: var(--btn-bg); color: var(--text-main); border-color: var(--border-color); border-width: 1px; }
        .btn-secondary:active { background-color: var(--btn-hover); transform: scale(0.97); }
        
        .touchpad-area { background-color: var(--touchpad-bg); border-color: var(--border-color); border-width: 1px; touch-action: none; }
        .input-custom { background-color: var(--bg-main); color: var(--text-main); border-color: var(--border-color); border-width: 1px; }
        .input-custom:focus { border-color: var(--accent); outline: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

    <header class="panel border-b p-4 flex justify-between items-center shadow-sm z-10 relative">
        <div class="flex flex-col">
            <h1 class="font-extrabold text-2xl tracking-wider">rmc88</h1>
            <span id="connection-status" class="text-xs text-red-500 flex items-center gap-1.5 font-semibold mt-0.5">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> 
                <span id="status-text">Disconnected</span>
            </span>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleTheme()" class="btn-secondary w-10 h-10 rounded-xl transition flex items-center justify-center">
                <i class="fa-solid fa-palette text-sm"></i>
            </button>
            <button onclick="toggleConnectionPanel()" class="btn-secondary w-10 h-10 rounded-xl transition flex items-center justify-center">
                <i class="fa-solid fa-wifi text-sm"></i>
            </button>
        </div>
    </header>

    <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col gap-4">

        <div id="connection-panel" class="panel p-4 rounded-2xl shadow-xl transition-all">
            <label class="block text-xs font-semibold text-muted mb-2 uppercase tracking-wide">Server IP Address</label>
            <div class="flex gap-2">
                <input type="text" id="server-ip" placeholder="192.168.1.X:5555" class="input-custom flex-1 rounded-xl px-4 py-2.5 text-sm transition">
                <button onclick="connectServer()" class="btn-accent px-5 rounded-xl text-sm font-semibold transition shadow-md">Connect</button>
            </div>
        </div>

        <div class="panel rounded-2xl p-4 flex flex-col gap-3 shadow-xl flex-1 min-h-[300px]">
            <div class="text-xs font-bold uppercase tracking-wider flex justify-between items-center text-muted">
                <span><i class="fa-solid fa-hand-pointer mr-1"></i> Touchpad</span>
                <span class="btn-secondary px-2 py-0.5 rounded-md text-[10px] pointer-events-none">SWIPE TO MOVE</span>
            </div>
            
            <div id="touchpad" class="touchpad-area flex-1 rounded-xl flex items-center justify-center text-sm select-none transition relative overflow-hidden shadow-inner">
                <span class="opacity-20 font-medium tracking-wide pointer-events-none">Touch & Drag Area</span>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mt-1">
                <button onclick="mouseClick('left')" class="btn-secondary py-4 rounded-xl text-sm font-bold transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-computer-mouse"></i> Left Click
                </button>
                <button onclick="mouseClick('right')" class="btn-secondary py-4 rounded-xl text-sm font-bold transition flex items-center justify-center gap-2">
                    Right Click <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>

        <div class="panel rounded-2xl p-4 flex flex-col gap-3 shadow-xl">
            <div class="text-xs font-bold uppercase tracking-wider flex justify-between items-center text-muted">
                <span><i class="fa-solid fa-keyboard mr-1"></i> Smart Keyboard</span>
            </div>
            
            <div class="relative">
                <input type="text" id="phone-keyboard-input" placeholder="Tap here to open phone keyboard..." 
                    class="input-custom w-full rounded-xl px-4 py-3 text-sm transition shadow-inner"
                    oninput="handleTyping(event)" onkeydown="handleSpecialKeys(event)">
            </div>
            
            <div class="grid grid-cols-4 gap-2 pt-1">
                <button onclick="sendKey('enter')" class="btn-secondary py-3 rounded-lg text-xs font-bold transition">Enter</button>
                <button onclick="sendKey('backspace')" class="btn-secondary py-3 rounded-lg text-xs font-bold transition">Bksp</button>
                <button onclick="sendKey('space')" class="btn-secondary py-3 rounded-lg text-xs font-bold transition">Space</button>
                <button onclick="sendKey('escape')" class="btn-secondary py-3 rounded-lg text-xs font-bold transition">Esc</button>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="sendHotkey(['ctrl', 'c'])" class="btn-secondary py-2.5 rounded-lg text-xs font-bold transition text-blue-500">Ctrl + C</button>
                <button onclick="sendHotkey(['ctrl', 'v'])" class="btn-secondary py-2.5 rounded-lg text-xs font-bold transition text-blue-500">Ctrl + V</button>
                <button onclick="sendHotkey(['alt', 'tab'])" class="btn-secondary py-2.5 rounded-lg text-xs font-bold transition text-blue-500">Alt + Tab</button>
            </div>
        </div>

    </main>

    <footer class="panel border-t py-5 px-4 text-center text-xs text-muted mt-auto">
        <p class="font-bold mb-1 tracking-wide">rmc88 Remote Control System</p>
        <p>Copyright &copy; mohamed005cheikh@gmail.com | by mc88</p>
    </footer>

    <script>
        // === Theme System ===
        const themes = ['dark', 'light', 'neon'];
        let currentThemeIndex = 0;

        function applySavedTheme() {
            const saved = localStorage.getItem('rmc88_theme');
            if(saved && themes.includes(saved)) {
                currentThemeIndex = themes.indexOf(saved);
                document.documentElement.setAttribute('data-theme', saved);
            }
        }
        
        function toggleTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const newTheme = themes[currentThemeIndex];
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('rmc88_theme', newTheme);
        }

        // === Connection & Logic ===
        let serverUrl = localStorage.getItem('rmc88_server_ip') || '';

        window.onload = function() {
            applySavedTheme();
            const panel = document.getElementById('connection-panel');
            
            if (serverUrl) {
                document.getElementById('server-ip').value = serverUrl;
                panel.classList.add('hidden'); // Hide panel to save space if IP exists
                testConnection();
            }
        };

        function toggleConnectionPanel() {
            const panel = document.getElementById('connection-panel');
            panel.classList.toggle('hidden');
        }

        function connectServer() {
            let ip = document.getElementById('server-ip').value.trim();
            if (!ip.startsWith('http://') && !ip.startsWith('https://')) {
                ip = 'http://' + ip;
            }
            serverUrl = ip;
            localStorage.setItem('rmc88_server_ip', serverUrl);
            
            // Hide panel automatically after connecting
            document.getElementById('connection-panel').classList.add('hidden');
            testConnection();
        }

        async function testConnection() {
            if (!serverUrl) return;
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            const statusContainer = document.getElementById('connection-status');
            
            try {
                let res = await fetch(`${serverUrl}/ping`, { method: 'GET', mode: 'cors' });
                if (res.ok) {
                    statusText.innerText = 'Connected';
                    statusContainer.className = 'text-xs text-emerald-500 flex items-center gap-1.5 font-semibold mt-0.5';
                    statusDot.className = 'w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]';
                } else {
                    throw new Error();
                }
            } catch (e) {
                statusText.innerText = 'Disconnected';
                statusContainer.className = 'text-xs text-red-500 flex items-center gap-1.5 font-semibold mt-0.5';
                statusDot.className = 'w-2 h-2 rounded-full bg-red-500 animate-pulse shadow-[0_0_8px_rgba(239,68,68,0.8)]';
            }
        }

        async function sendCommand(action, data = {}) {
            if (!serverUrl) {
                alert('Please open the Wi-Fi panel at the top and connect to your Server IP first!');
                toggleConnectionPanel();
                return;
            }
            try {
                await fetch(`${serverUrl}/command`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, ...data }),
                    mode: 'cors'
                });
            } catch (err) {
                console.error("Command failed", err);
            }
        }

        // === Touchpad Movement ===
        function mouseClick(button) { sendCommand('mouse_click', { button: button }); }

        const touchpad = document.getElementById('touchpad');
        let isTouching = false;
        let lastX = 0, lastY = 0;

        touchpad.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isTouching = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        }, { passive: false });

        touchpad.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isTouching) return;
            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;
            // Sensitivity multiplier = 1.8
            let dx = (currentX - lastX) * 1.8;
            let dy = (currentY - lastY) * 1.8;
            lastX = currentX;
            lastY = currentY;
            sendCommand('mouse_move', { dx: dx, dy: dy });
        }, { passive: false });

        touchpad.addEventListener('touchend', (e) => { 
            e.preventDefault();
            isTouching = false; 
        });

        // === Phone Keyboard Logic ===
        let lastLength = 0;
        function handleTyping(e) {
            let val = e.target.value;
            if (val.length > lastLength) {
                let newChars = val.slice(lastLength);
                sendCommand('type_text', { text: newChars });
            } else if (val.length < lastLength) {
                sendCommand('key_press', { key: 'backspace' });
            }
            lastLength = val.length;
            
            // Periodically clear input to prevent lag
            if (val.length > 15) {
                e.target.value = '';
                lastLength = 0;
            }
        }

        function handleSpecialKeys(e) {
            if (e.key === 'Enter') {
                sendCommand('key_press', { key: 'enter' });
                e.target.value = '';
                lastLength = 0;
                e.preventDefault();
            }
        }

        function sendKey(key) { sendCommand('key_press', { key: key }); }
        function sendHotkey(keys) { sendCommand('hotkey', { keys: keys }); }
    </script>
</body>
</html>
